name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.data.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: data
        name: Pinned data release
        run: |
          TAG=$(jq -r .tag data-release.json)
          SHA=$(jq -r .sha256 data-release.json)
          [[ -z "$TAG" ]] && { echo "No data release pinned yet; skipping deploy."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [[ "$TAG" =~ ^data-[0-9]{4}-[0-9]{2}-[0-9]{2}-r[0-9]+$ && "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "data-release.json is malformed"; exit 1; }
          { echo "ready=true"; echo "tag=$TAG"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.data.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        if: steps.data.outputs.ready == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build site with verified data
        if: steps.data.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.data.outputs.tag }}
          SHA: ${{ steps.data.outputs.sha }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          npm ci
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.tar.gz" --dir "$RUNNER_TEMP"
          echo "$SHA  $RUNNER_TEMP/${TAG}.tar.gz" | sha256sum -c -
          VITE_SITE_URL="$BASE_URL/" npm run build
          tar -xzf "$RUNNER_TEMP/${TAG}.tar.gz" -C dist
          node scripts/make-pages.ts dist "$BASE_URL/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.data.outputs.ready == 'true'
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # authenticate the deployment with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
